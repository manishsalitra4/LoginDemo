databases:
  - name: logindemo-db
    plan: free
    databaseName: logindemo
    user: logindemo
services:
  - type: web
    name: logindemo
    runtime: ruby
    plan: free
    buildCommand: bundle install && bundle exec rails db:migrate
    startCommand: bundle exec puma -p $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: logindemo-db
          property: connectionString
      - key: RAILS_ENV
        value: production
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
